[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--doctest-modules --cov escpos --cov-report=xml"
testpaths = ["test", "src", "src/escpos", "escpos"]


[[tool.mypy.overrides]]
module = [
  "pytest",
  "jaconv",
  "scripttest",
  "barcode.*",
  "qrcode",
  "usb.*",
  "cups",
  "win32print",
]
ignore_missing_imports = true


[tool.ruff]
extend-exclude = [
    ".github",
    "__pycache__",
    "doc/conf.py",
    "build",
    "capabilities-data",
    "test",
    "src/escpos/constants.py",
]
line-length = 120
show-fixes = true
src = ["."]
target-version = "py38"


[tool.ruff.format]
line-ending = "lf"


[tool.ruff.lint]
select = ["E", "F", "W", "D", "I"]


[tool.ruff.lint.pydocstyle]
convention = "pep257"


[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.tox]
requires = ["tox>=4.11"]
envlist = ["3.10", "3.11", "3.12", "3.13", "3.14", "docs", "style", "mypy"]


[tool.tox.gh.python]
"3.14" = ["3.14"]
"3.13" = ["3.13"]
"3.12" = ["3.12"]
"3.11" = ["3.11"]
"3.10" = ["3.10"]


[tool.tox.env_run_base]
deps = [
  "jaconv",
  "coverage",
  "scripttest",
  "mock",
  "pytest>=7.4",
  "pytest-cov",
  "pytest-mock",
  "hypothesis>=6.83",
  "python-barcode>=0.16.0,<1",
]
extras = ["all"]
commands = [["pytest", { replace = "posargs", extend = true }]]
passenv = [
  "ESCPOS_CAPABILITIES_PICKLE_DIR",
  "ESCPOS_CAPABILITIES_FILE",
  "CI",
  "TRAVIS",
  "TRAVIS_*",
  "APPVEYOR",
  "APPVEYOR_*",
  "CODECOV_*",
]
setenv = { PY_IGNORE_IMPORTMISMATCH = "1" }


[tool.tox.env.docs]
base_python = ["python"]
changedir = "doc"
deps = [
  "sphinx>=7.2.3",
  "setuptools_scm",
  "python-barcode>=0.16.0,<1",
  "sphinx-argparse",
  "sphinxcontrib-spelling>=8.0.2",
  "sphinxcontrib.datatemplates",
  "sphinx-autodoc-typehints",
  "sphinx_rtd_theme",
  "pycups",
]
commands = [
  [
    "sphinx-build",
    "-W",
    "-b",
    "html",
    "-d",
    "{envtmpdir}/doctrees",
    ".",
    "{envtmpdir}/html",
  ],
  [
    "sphinx-build",
    "-W",
    "-b",
    "spelling",
    "-d",
    "{envtmpdir}/doctrees",
    ".",
    "{envtmpdir}/spelling",
  ],
]


[tool.tox.env.style]
base_python = ["python"]
deps = ["ruff"]
commands = [["ruff", "check", "."], ["ruff", "format"]]


[tool.tox.env.mypy]
base_python = ["python"]
deps = [
  "mypy",
  "types-six",
  "types-mock",
  "types-PyYAML",
  "types-Pillow",
  "types-pyserial",
  "types-pywin32>=306.0.0.6",
  "types-flask",
  "hypothesis>=6.83",
  "jaconv",
]
commands = [["mypy", "src", "test", "examples"]]


[tool.coverage.run]
branch = true
