[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--doctest-modules --cov escpos --cov-report=xml"
testpaths = [
    "test",
    "src",
    "src/escpos",
    "escpos",
]

[[tool.mypy.overrides]]
module = ["pytest",
          "jaconv",
          "scripttest",
          "barcode.*",
          "qrcode",
          "usb.*",
          "cups",
          "win32print"
         ]
ignore_missing_imports = true


[tool.ruff]
extend-exclude = [
    ".github",
    "__pycache__",
    "doc/conf.py",
    "build",
    "capabilities-data",
    "test",
    "src/escpos/constants.py",
]
line-length = 120
show-fixes = true
src = ["."]
target-version = "py38"


[tool.ruff.format]
line-ending = "lf"


[tool.ruff.lint]
select = ["E", "F", "W", "D"]


[tool.ruff.lint.pydocstyle]
convention = "pep257"


[tool.ruff.lint.mccabe]
max-complexity = 10
