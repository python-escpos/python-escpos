# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
name: Python package
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz libenchant-2-2 gcc libcups2-dev python3-dev xindy
        python -m pip install --upgrade pip
        pip install pytest tox tox-gh
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test with tox
      run: |
        tox --conf pyproject.toml
      env:
        ESCPOS_CAPABILITIES_FILE: /home/runner/work/python-escpos/python-escpos/capabilities-data/dist/capabilities.json
    - name: Test mypy with tox
      run: |
        tox --conf pyproject.toml -e mypy
      env:
        ESCPOS_CAPABILITIES_FILE: /home/runner/work/python-escpos/python-escpos/capabilities-data/dist/capabilities.json
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        files: ./coverage.xml
        exclude: "**/.mypy_cache"
        flags: unittests
        name: coverage-tox-${{ matrix.python-version }}
        verbose: true
